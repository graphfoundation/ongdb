# Full-reactor gate for release branches (1.0 / 1.1 / 2.0) and PRs into them.
# Separate from ci-dev.yml so only this job appears on release PR checks.
#
# Required check name on release branch protection: full-reactor

name: Java CI (release)

on:
  push:
    branches:
      - '1.0'
      - '1.1'
      - '2.0'
  pull_request:
    branches:
      - '1.0'
      - '1.1'
      - '2.0'

env:
  MAVEN_OPTS: -Xmx4g
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  full-reactor:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v5
      - name: Raise open file limit
        run: ulimit -n 40000 && ulimit -n
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Full reactor clean install
        run: mvn -B clean install -DfullBuild -Drevapi.skip=true -DcreateChecksum=true
      - name: Upload CI snapshot distributions
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ci-snapshot-ongdb-${{ github.run_id }}
          path: |
            packaging/standalone/target/ongdb-community-*-unix.tar.gz
            packaging/standalone/target/ongdb-enterprise-*-unix.tar.gz
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: full-reactor-test-reports-${{ github.run_id }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14
