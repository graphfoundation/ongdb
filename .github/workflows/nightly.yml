# Nightly full reactor on release lines — keep 1.0 / 1.1 / 2.0 clean.
# Cron only runs from the repository default branch; matrix still builds each release ref.
# See ongdb-dev/ongdb-11/CI-BRANCH-STRATEGY.md

name: Nightly full reactor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.repository }}-release-matrix
  cancel-in-progress: false

env:
  MAVEN_OPTS: -Xmx4g
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  full-reactor:
    if: github.repository == 'graphfoundation/ongdb'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        branch: [1.0, 1.1, 2.0]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - name: Raise open file limit
        run: ulimit -n 40000 && ulimit -n
      - name: Resolve Java version
        id: java
        run: |
          case "${{ matrix.branch }}" in
            2.*) echo "version=11" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=8" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: temurin
          cache: maven
      - name: Full reactor clean install
        run: mvn -B -Drevapi.skip=true clean install
      - name: Upload CI snapshot distributions
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ci-snapshot-${{ matrix.branch }}-${{ github.run_id }}
          path: |
            packaging/standalone/target/ongdb-community-*-unix.tar.gz
            packaging/standalone/target/ongdb-enterprise-*-unix.tar.gz
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-test-reports-${{ matrix.branch }}-${{ github.run_id }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14
