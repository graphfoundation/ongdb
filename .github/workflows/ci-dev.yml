# CI for integration (*-dev) branches and PRs into them.
# Separate from ci-release.yml so release PRs do not also pick up a build
# check from the head-branch push.
#
# Required check name on *-dev branch protection (if enabled): build

name: Java CI (dev)

on:
  push:
    branches:
      - '1.0-dev'
      - '1.1-dev'
      - '2.0-dev'
  pull_request:
    branches:
      - '1.0-dev'
      - '1.1-dev'
      - '2.0-dev'

env:
  MAVEN_OPTS: -Xmx4g
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn -B clean install -DfullBuild -Drevapi.skip=true -DcreateChecksum=true
