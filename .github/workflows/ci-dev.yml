# CI for integration branches and PRs that are not targeting a release branch
# (e.g. work on 1.0-dev). Separate from ci-release.yml so GitHub does not
# surface a skipped sibling job on the same workflow run.
#
# Required check name on *-dev branch protection (if enabled): build

name: Java CI (dev)

on:
  push:
    branches-ignore:
      - '1.0'
      - '1.1'
      - '2.0'
  pull_request:
    branches-ignore:
      - '1.0'
      - '1.1'
      - '2.0'

env:
  MAVEN_OPTS: -Xmx4g
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn -B clean install -DfullBuild -Drevapi.skip=true -DcreateChecksum=true
